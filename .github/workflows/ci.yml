name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Typechecks src and src/test. The test suite was silently skipped for a
      # long time because a compile error in a test file only surfaces here.
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # docs/rules.md is generated, so a new or renamed rule must be committed
      # with its regenerated table.
      - name: Rules doc is up to date
        run: |
          node ./scripts/generate-rules-doc.mjs
          git diff --exit-code docs/rules.md

      # Every optimization rule must prove a representative replacement is
      # actually an optimization on 68000, or carry an explicit exemption.
      - name: Rule impact audit
        run: npm run audit:impact
